name: Release
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "PicoFacialDataModule/**"
      - "module.json"
      - "PicoFacialDataModule.slnx"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore PicoFacialDataModule.slnx

      - name: Build with MSBuild
        run: msbuild PicoFacialDataModule/PicoFacialDataModule.csproj /p:Configuration=Release /p:BuildProjectReferences=true

      - name: ZIP Module
        run: |
          Compress-Archive -Path "PicoFacialDataModule/bin/Release/net10.0/PicoFacialDataModule.dll", "module.json" -DestinationPath "picofacialdatamodule.zip" -Force

      - name: Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
          picofacialdatamodule.zip \
          --repo="$GITHUB_REPOSITORY" \
          --title="${tag#v}" \
          --generate-notes
